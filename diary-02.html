      <h1>夕方、中山手を歩く</h1>
      <div class="article-body">
      <p>ローライフレックスを持って中山手を歩いた。日中よりも光が弱くなり、建物の影が長く伸びていた。</p>
      <p>ファインダーを上から覗きながら歩いていると、普段は気に留めない植木や窓、道の曲がり方が気になってくる。</p>
      <p>何枚か撮った。うまく写っているかはまだ分からない。</p>
