  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-flow: row;
      columns: auto;
      gap: 48px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      align-items: start;
    }
    .photo-grid > .photo-item {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
    }
    .photo-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .photo-item figcaption {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 12px;
      margin: 0;
      padding-top: 8px;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: .03em;
      color: #555;
    }
    @media (max-width:760px) {
      .photo-grid { gap: 36px; }
      .photo-item figcaption {
        grid-template-columns: 28px minmax(0, 1fr) auto;
        gap: 8px;
      }
    }
  </style>
