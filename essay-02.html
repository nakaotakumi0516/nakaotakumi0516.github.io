      <h1>地形をつくるということ</h1>
      <div class="article-body">
      <p>建築を考えるとき、床は水平であることが前提になりやすい。しかし少し傾いた地面には、水平な床とは違う身体の使い方が生まれる。</p>
      <p>緩い斜面なら座ることも寝転ぶこともできる。少し急になれば、そこは移動するための坂になったり、誰かを見るための観客席のようになったりする。</p>
      <p>地形をつくることは、形をつくることだけではなく、その場所でどのように身体を動かすかを考えることなのだと思う。</p>
      </div>
