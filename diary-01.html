      <h1>フィルムを現像に出した日</h1>
      <div class="article-body">
      <p>撮った写真をすぐに確認できないことにも、少しずつ慣れてきた。デジタルカメラやスマートフォンでは撮った直後に画面を見る癖がついているので、最初は何も確認できないことが少し不安だった。</p>
      <p>けれど、何を撮ったのかを忘れかけたころに写真が戻ってくるのは面白い。その日の光や歩いた道を、写真を見ながらもう一度思い出すことになる。</p>
      <p>今日はフィルムを一本、現像に出した。戻ってくるまで、しばらく待つ。</p>
      </div>
